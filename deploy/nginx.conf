# nginx config for the ACCA FA QuizApp static export (`out/`).
# Mounted at /etc/nginx/conf.d/default.conf, serving /usr/share/nginx/html.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type text/html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Security headers (moved here from next.config since this is a static export).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # connect-src allows any https/wss so the user's own Firebase project (Auth +
    # Firestore) works; frame-src allows the Firebase auth handler domain.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src 'self' https://*.firebaseapp.com https://*.web.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets — safe to cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js|json|svg|png|jpg|jpeg|gif|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
